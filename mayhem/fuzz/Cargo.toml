[package]
name = "jless-fuzz"
version = "0.0.0"
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The additive library shim over the unmodified upstream sources (upstream ships
# no lib target) — same code path the original fork's fuzz/ harness drove.
[dependencies.jless]
path = "../jless-lib"

# Prevent this from interfering with any enclosing workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "jsonparser"
path = "fuzz_targets/jsonparser.rs"
test = false
doc = false
